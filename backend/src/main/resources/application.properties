spring.application.name=pedeai-backend

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pedeai}
spring.jackson.default-property-inclusion=non_null

socket.host=${SOCKET_HOST:localhost}
socket.port=${SOCKET_PORT:5000}

jwt.secret=${JWT_SECRET:}
jwt.expirationMinutes=${JWT_EXPIRATION_MINUTES:60}

cors.origins=${CORS_ORIGINS:http://localhost:3000}
