name: pedeai

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./banco:/banco:ro
    environment:
      DB_URI: mongodb://mongo:27017/pedeai
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mongosh --quiet "$$DB_URI" /banco/init-mongo.js
        stores=$$(mongosh --quiet "$$DB_URI" --eval 'db.store.countDocuments({ slug: "triunfo-lanches" })')
        if [ "$$stores" = "0" ]; then
          mongosh --quiet "$$DB_URI" /banco/seed.js
        else
          echo "casa de demonstração já existe, seed ignorado"
        fi
    restart: "no"

  server:
    build: ./server
    restart: unless-stopped
    environment:
      SOCKET_PORT: 5000
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/5000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/pedeai}
      SOCKET_HOST: server
      SOCKET_PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env da raiz}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      server:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      - backend

volumes:
  mongo-data:
