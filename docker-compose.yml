name: pedeai

services:
  # Banco MongoDB, com os dados guardados no volume mongo-data
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cria as coleções e carrega a casa de demonstração na primeira subida
  db-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./banco:/banco:ro
    environment:
      DB_URI: mongodb://mongo:27017/pedeai
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mongosh --quiet "$$DB_URI" /banco/init-mongo.js
        stores=$$(mongosh --quiet "$$DB_URI" --eval 'db.store.countDocuments({ slug: "triunfo-lanches" })')
        if [ "$$stores" = "0" ]; then
          mongosh --quiet "$$DB_URI" /banco/seed.js
        else
          echo "casa de demonstração já existe, seed ignorado"
          mongosh --quiet "$$DB_URI" --eval 'db.store.updateOne({ slug: "triunfo-lanches", pixKey: { $$in: [null, ""] } }, { $$set: { pixKey: "contato@triunfolanches.com" } })'
        fi
    restart: "no"

  # O server de socket roda fora do Docker, no terminal, antes do compose: mvn -f server/pom.xml compile exec:java
  # O backend o acessa pela máquina (host.docker.internal).
  # API Spring Boot; acessa o server de socket da máquina pelo host.docker.internal
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/pedeai}
      SOCKET_HOST: ${SOCKET_HOST:-host.docker.internal}
      SOCKET_PORT: ${SOCKET_PORT:-5000}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env da raiz}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    # No Linux o host.docker.internal precisa ser declarado; no Docker Desktop (Windows/Mac) ele já existe.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Site React servido pelo nginx
  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      - backend

volumes:
  mongo-data:
